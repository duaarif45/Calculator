<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dot1"></div>
    <div class="dot2"></div>

  <div class="landing" id="landingScreen">
    <div class="app-icon">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="2" width="16" height="20" rx="3" fill="#1fbf8f"/>
            <rect x="6.5" y="4.5" width="11" height="5" rx="1.2" fill="#0d0e10"/>
            <circle cx="8" cy="13" r="1.3" fill="#0d0e10"/>
            <circle cx="12" cy="13" r="1.3" fill="#0d0e10"/>
            <circle cx="16" cy="13" r="1.3" fill="#0d0e10"/>
            <circle cx="8" cy="17" r="1.3" fill="#0d0e10"/>
            <circle cx="12" cy="17" r="1.3" fill="#0d0e10"/>
            <circle cx="16" cy="17" r="1.3" fill="#f5a623"/>
        </svg>
    </div>
    <p class="open-text">Click to Open Calculator</p>
</div>

    <div class="calculator" id="calculatorBox">

        <input type="text" placeholder="0" id="inputBox">

        <div class="buttons">
            <button class="clearBtn">AC</button>
            <button class="clearBtn">DEL</button>
            <button>%</button>
            <button>*</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>-</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="equalBtn">=</button>

            <button>00</button>
            <button>0</button>
            <button>.</button>
        </div>
    </div>

    <script src="logic.js"></script>
</body>

</html>
